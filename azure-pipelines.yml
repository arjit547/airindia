trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '5f17aea6-2582-4678-a83e-adc8c8288f2f'

  imageRepository: 'node'

  containerRegistry: 'staticacr.azurecr.io'

  dockerfilePath: '$(Build.SourcesDirectory)/service1/Dockerfile'

  tag: '$(Build.BuildId)'

  vmImageName: 'ubuntu-latest'

  azureSubscription: 'b27510e1-140b-4f1d-ab9f-5f5f698b33d6'

  containerAppName: 'vcheck'

  resourceGroup: 'Arjit'

stages:

# =========================
# BUILD + PUSH
# =========================

- stage: Build
  displayName: Build and Push

  jobs:
  - job: Build
    displayName: Build Docker Image

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: Docker@2
      displayName: Build and push image to ACR

      inputs:
        command: buildAndPush

        repository: $(imageRepository)

        dockerfile: $(dockerfilePath)

        containerRegistry: $(dockerRegistryServiceConnection)

        buildContext: '$(Build.SourcesDirectory)/service1'

        tags: |
          $(tag)


# =========================
# DEPLOY
# =========================

- stage: Deploy
  displayName: Deploy to Container App

  dependsOn: Build

  jobs:
  - job: Deploy
    displayName: Deploy Container App

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: AzureContainerApps@1
      displayName: Deploy image to Container App

      inputs:
        azureSubscription: $(azureSubscription)

        containerAppName: $(containerAppName)

        resourceGroup: $(resourceGroup)

        imageToDeploy: '$(containerRegistry)/$(imageRepository):$(tag)'
